name: monitor

# Every ~15 minutes: check every service, fold the result into the history kept
# on the `data` branch, and publish the page with the fresh data to GitHub Pages.
# Off the top of the hour on purpose: GitHub delays schedules at :00 the most.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "pyproject.toml", ".github/workflows/monitor.yml"]

permissions:
  contents: write   # push the history to the data branch
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install .

      # History lives on an orphan `data` branch with a single commit, so main
      # stays free of ~100 data commits a day. A missing branch means the very
      # first run; any other fetch failure aborts the run instead of starting
      # from scratch and overwriting 90 days of history.
      - name: Restore history
        run: |
          mkdir -p site/data
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:status.json > site/data/status.json
          elif [ "$code" -eq 2 ]; then
            echo "No data branch yet: starting a fresh history."
          else
            echo "Could not reach the data branch (exit $code)." >&2
            exit 1
          fi

      - name: Check services
        run: python -m brstatus --state site/data/status.json

      - name: Save history
        working-directory: site/data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
          rm -rf .git

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
