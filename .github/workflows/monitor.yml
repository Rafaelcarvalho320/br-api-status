name: monitor

# Every ~15 minutes: check every service, fold the result into the history kept
# on the `data` branch, and publish the page with the fresh data to GitHub Pages.
# Off the top of the hour on purpose: GitHub delays schedules at :00 the most.
#
# Two jobs, so the token that can write to the repository never shares a job
# with third-party code. `check` installs packages from PyPI and parses whatever
# the monitored APIs send back, with a read-only token. `publish` only pushes a
# JSON file and deploys the page, with nothing installed.

on:
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["site/**", "src/**", "pyproject.toml", ".github/workflows/monitor.yml"]

permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - run: pip install .

      # History lives on an orphan `data` branch with a single commit, so main
      # stays free of ~100 data commits a day. A missing branch means the very
      # first run; any other fetch failure aborts the run instead of starting
      # from scratch and overwriting 90 days of history.
      - name: Restore history
        run: |
          mkdir -p site/data
          set +e
          git ls-remote --exit-code --heads origin data > /dev/null
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            git fetch --depth=1 origin data
            git show FETCH_HEAD:status.json > site/data/status.json
          elif [ "$code" -eq 2 ]; then
            echo "No data branch yet: starting a fresh history."
          else
            echo "Could not reach the data branch (exit $code)." >&2
            exit 1
          fi

      - name: Check services
        run: python -m brstatus --state site/data/status.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: status
          path: site/data/status.json
          retention-days: 1

      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site

  publish:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # push the history to the data branch
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: status
          path: data

      - name: Save history
        working-directory: data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -q -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
